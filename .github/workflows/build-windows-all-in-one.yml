name: Build Windows All-in-One Sender Receiver

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/BetterCastReceiverDesktop/**'
      - '.github/workflows/build-windows-all-in-one.yml'
      - 'CMakeLists.txt'

env:
  QT_VERSION: '6.7.3'
  VDD_VERSION: '25.7.23'
  VDD_DRIVER_SHA256: 'e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a'
  VDD_CONTROL_SHA256: 'a701f2272e9fcf382849b24f913c6dd07597b3b1116525f2e90182f019609154'

jobs:
  build-windows-all-in-one:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          Remove-Item -Recurse -Force C:/Qt -ErrorAction SilentlyContinue
          $qtPrefix = "C:/Qt/$env:QT_VERSION/msvc2019_64"
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Qt installation attempt $attempt"
            & python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2019_64 `
              --modules qtmultimedia `
              --outputdir C:/Qt
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$qtPrefix/lib/cmake/Qt6/Qt6Config.cmake")) {
              $installed = $true
              break
            }
            Remove-Item -Recurse -Force C:/Qt -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          if (-not $installed) { throw "Qt $env:QT_VERSION installation failed or Qt6Config.cmake is missing" }
          "Qt6_DIR=$qtPrefix" >> $env:GITHUB_ENV
          "$qtPrefix/bin" >> $env:GITHUB_PATH

      - name: Install FFmpeg with H.264 encoder support
        shell: pwsh
        run: |
          vcpkg install "ffmpeg[openh264]:x64-windows" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Download and verify Virtual Display Driver
        shell: pwsh
        run: |
          function Assert-Sha256([string]$Path, [string]$Expected) {
            $actual = (Get-FileHash -Algorithm SHA256 $Path).Hash.ToLowerInvariant()
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path: expected $Expected, got $actual"
            }
          }
          $baseUrl = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/$env:VDD_VERSION"
          New-Item -ItemType Directory -Force vdd, vdd-driver-extract, vdd-control-extract | Out-Null

          Invoke-WebRequest -Uri "$baseUrl/VirtualDisplayDriver-x86.Driver.Only.zip" -OutFile vdd-driver.zip
          Assert-Sha256 vdd-driver.zip $env:VDD_DRIVER_SHA256
          Expand-Archive -Path vdd-driver.zip -DestinationPath vdd-driver-extract
          Get-ChildItem vdd-driver-extract -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName "vdd/$($_.Name)" -Force
          }

          Invoke-WebRequest -Uri "$baseUrl/VDD.Control.$env:VDD_VERSION.zip" -OutFile vdd-control.zip
          Assert-Sha256 vdd-control.zip $env:VDD_CONTROL_SHA256
          Expand-Archive -Path vdd-control.zip -DestinationPath vdd-control-extract
          $control = Get-ChildItem vdd-control-extract -Recurse -Filter 'VDD Control.exe' | Select-Object -First 1
          $devcon = Get-ChildItem vdd-control-extract -Recurse -Filter 'devcon.exe' | Select-Object -First 1
          if (-not $control -or -not $devcon) { throw 'VDD Control.exe or devcon.exe missing from verified package' }
          Copy-Item $control.FullName 'vdd/VDD Control.exe' -Force
          Copy-Item $devcon.FullName 'vdd/devcon.exe' -Force

          if (-not (Test-Path 'vdd/MttVDD.inf')) { throw 'Verified VDD package did not contain MttVDD.inf' }
          Write-Host 'Verified VDD payload:'
          Get-ChildItem vdd | Format-Table Name,Length

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -c "from PIL import Image; img=Image.open('Sources/BetterCastReceiverDesktop/icon_256x256.png'); img.save('Sources/BetterCastReceiverDesktop/appicon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure all-in-one sender and receiver build
        shell: pwsh
        run: |
          cmake -S Sources/BetterCastReceiverDesktop -B build-windows-all-in-one `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DENABLE_SENDER=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-windows-all-in-one --config Release --parallel

      - name: Package all-in-one receiver and sender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = Get-ChildItem build-windows-all-in-one -Filter BetterCastReceiver.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BetterCastReceiver.exe was not produced by the build" }
          Copy-Item $exe.FullName artifact/BetterCast.exe
          # Keep Qt's software OpenGL fallback for legacy Intel hardware.
          windeployqt --release --no-translations --no-system-d3d-compiler artifact/BetterCast.exe
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object { Copy-Item $_.FullName artifact/ -Force }
          }
          New-Item -ItemType Directory -Force artifact/VirtualDisplayDriver | Out-Null
          Copy-Item "vdd/*" "artifact/VirtualDisplayDriver/" -Force
          @"
          BetterCast all-in-one Windows sender/receiver build.

          Windows to Android second-monitor test:
          1. Start BetterCast.exe.
          2. If prompted by Windows User Account Control, approve installation of the verified virtual-display driver.
          2. Open Send Screen.
          3. Select a monitor or create/select the optional virtual display.
          4. Enter the Android receiver IP and port 51820.
          5. Start sending.
          6. On Android, select Receive and wait for the Windows sender.

          If the UI is blank, run: BetterCast.exe --software-opengl
          "@ | Set-Content artifact/README-WINDOWS-ANDROID.txt
          Get-ChildItem artifact | Sort-Object Name | Format-Table Name,Length

      - name: Upload all-in-one artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCast-Windows-Android-All-in-One
          path: artifact/
          if-no-files-found: error
          retention-days: 30
