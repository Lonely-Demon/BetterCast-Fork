name: Build Android Receiver

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/BetterCastReceiverAndroid/**'
      - '.github/workflows/build-android-receiver.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests and assemble debug APK
        working-directory: Sources/BetterCastReceiverAndroid
        run: ./gradlew test assembleDebug --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BetterCast-Android-Dual-Mode-debug
          path: Sources/BetterCastReceiverAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
