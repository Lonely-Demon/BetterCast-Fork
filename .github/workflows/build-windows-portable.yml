name: Build Windows Receiver Portable

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/BetterCastReceiverDesktop/**'
      - '.github/workflows/build-windows-portable.yml'
      - 'CMakeLists.txt'

env:
  QT_VERSION: '6.7.0'

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2019_64 `
            --modules qtmultimedia `
            --outputdir C:/Qt
          "Qt6_DIR=C:/Qt/$env:QT_VERSION/msvc2019_64" >> $env:GITHUB_ENV
          "C:/Qt/$env:QT_VERSION/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Install FFmpeg
        shell: pwsh
        run: |
          vcpkg install "ffmpeg:x64-windows" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -c "from PIL import Image; img=Image.open('Sources/BetterCastReceiverDesktop/icon_256x256.png'); img.save('Sources/BetterCastReceiverDesktop/appicon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure receiver-only build
        shell: pwsh
        run: |
          cmake -S Sources/BetterCastReceiverDesktop -B build-windows-portable `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DENABLE_SENDER=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build-windows-portable --config Release --parallel

      - name: Package portable receiver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = Get-ChildItem build-windows-portable -Filter BetterCastReceiver.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BetterCastReceiver.exe was not produced by the build" }
          Copy-Item $exe.FullName artifact/BetterCastReceiver.exe
          # Do not pass --no-opengl-sw: legacy Windows hardware may need Qt's software renderer.
          windeployqt --release --no-translations --no-system-d3d-compiler artifact/BetterCastReceiver.exe
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object { Copy-Item $_.FullName artifact/ -Force }
          }
          "BetterCastReceiver.exe --software-opengl" | Set-Content artifact/START_WITH_SOFTWARE_OPENGL.txt
          Get-ChildItem artifact | Sort-Object Name | Format-Table Name,Length

      - name: Upload portable receiver
        uses: actions/upload-artifact@v4
        with:
          name: BetterCastReceiver-Windows-portable
          path: artifact/
          if-no-files-found: error
